<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<meta name="color-scheme" content="light">
<title>STATICHEARTS</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f5f5f5;
    overflow: hidden;
    overscroll-behavior: none;
  }
  /* 모눈 노트처럼 잔잔한 도트 */
  body {
    background-image: radial-gradient(circle, #c5ced5 0.9px, transparent 1.3px);
    background-size: 26px 26px;
    background-position: 13px 13px;
  }
  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 실 한 가닥으로 쓰는 Statichearts */
  /* 배경 선: 가장자리에 가는 실 (js/backdrop.js) */
  #backdrop {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  /* 타이포의 실과 같은 색·굵기 (굵기는 intro.js가 화면 크기에 맞춰 --thread-px로 알려 준다) */
  #backdrop path { fill: none; stroke: #1d2126; stroke-width: var(--thread-px, 2.4px); stroke-linecap: round; }
  #intro {
    position: fixed;
    inset: 0;
    touch-action: none;
  }
  #intro svg { display: block; width: 100%; height: 100%; }
  /* 실·되돌림 획·케이블은 모두 같은 두께 */
  #intro .thread, #intro .cable, #intro .accent {
    fill: none;
    stroke: #1d2126;
    stroke-width: 9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* i의 점: 실 위에 꿴 짧은 획 모양의 구슬 */
  #intro .bead {
    fill: #1d2126;
    stroke: #1d2126;
    stroke-width: 8;
    transform-box: fill-box;
    transform-origin: center;
  }
  /* 꽂는 순간 실을 타고 올라가는 신호 */
  #intro .pulse {
    fill: none;
    stroke: #9db6c9;
    stroke-width: 4.5;
    stroke-linecap: round;
    opacity: 0;
    pointer-events: none;
  }
  /* 플러그와 소켓 */
  #intro .plug { outline: none; }
  #intro .plug .boot { fill: #1d2126; }
  #intro .plug .groove { stroke: #4a525b; stroke-width: 0.6; }
  #intro .plug .metal { fill: url(#plug-metal); stroke: #4f565d; stroke-width: 0.35; }
  #intro .plug .band { fill: #1d2126; }
  #intro .plug:focus-visible .boot { fill: #3f6f93; }
  #intro .socket { opacity: 0; transition: opacity 0.7s ease 0.2s; }
  #intro .socket.on { opacity: 1; }
  #intro .socket .ring { fill: #f5f5f5; stroke: #1d2126; stroke-width: 3.6; }
  #intro .socket .hole { fill: #1d2126; transform-box: fill-box; transform-origin: center; }
  #intro .socket.ready .hole { animation: socket-ready 1.3s ease-in-out infinite; }
  @keyframes socket-ready { 50% { transform: scale(1.4); } }
  @media (prefers-reduced-motion: reduce) {
    #intro .socket.ready .hole { animation: none; transform: scale(1.3); }
  }
  #replay {
    position: fixed;
    z-index: 2;
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    padding: 6px 8px;
    border: 0;
    background: none;
    color: #9aaab6;
    font: 11px "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    letter-spacing: 0.18em;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  #replay:hover { color: #3d4752; }
  /* 가운데 무대: 정방형 사진과 그 아래 신호 패널(실 한 줄 + 문구)을 한 덩어리로 묶는다.
     사진 한 변(--s)을 기준으로 실 폭·간격·높이를 모두 비율로 잡아, 화면 크기가 달라도 생김새가 그대로다.
     화면 정중앙에 두되, 좁은 화면에선 글자 오른쪽 끝(--type-right, intro.js)을 넘지 않게 오른쪽으로 비켜난다 */
  #stage {
    position: fixed;
    z-index: 1;
    top: 50%;
    --s: min(400px, 38vw, 47vh, calc((100vw - var(--type-right, 0px) - 44px) / 1.12));
    width: calc(var(--s) * 1.12);
    left: max(calc(50% - var(--s) * 0.56), calc(var(--type-right, 0px) + 28px));
    transform: translateY(-50%);
    pointer-events: none;
  }
  /* 폰(좁은 세로 화면): 글자는 왼쪽 구석, 플레이어는 화면 정가운데. 글자에 닿지 않는 한 크게 */
  @media (max-width: 599px) and (orientation: portrait) {
    #stage {
      --s: min(400px, 62vw, 47vh, calc((50vw - var(--type-right, 0px) - 10px) / 0.56));
      left: calc(50% - var(--s) * 0.56);
    }
  }
  #photo {
    display: block;
    width: var(--s);
    height: var(--s);
    margin: 0 auto;
    object-fit: cover;
    object-position: 50% 50%;
    -webkit-user-drag: none;
    opacity: 0;
    /* 연결되기 전엔 어떤 사진이든 채도를 낮춰 바랜 듯이, 꽂으면 천천히 제 색이 돌아온다 */
    filter: saturate(0.3) brightness(1.03);
    transition: opacity 1.2s ease, filter 1.6s ease;
  }
  #photo.on { opacity: 1; }
  /* 유튜브 곡을 들을 땐 사진 자리에 영상 창이 덮인다 (js/sound.js).
     유튜브 정책상 플레이어는 숨길 수 없고 200×200px 이상이어야 해서, 작은 화면에서도 200px 밑으로는 줄지 않는다 */
  #ytbox {
    position: absolute;
    z-index: 1;
    top: 0;
    left: 50%;
    width: max(200px, var(--s));
    height: max(200px, var(--s));
    transform: translateX(-50%);
    background: #1d2126;
    opacity: 0;
    visibility: hidden;
    pointer-events: auto;
    transition: opacity 0.8s ease, visibility 0s linear 0.8s;
  }
  #ytbox.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  #ytbox iframe { display: block; width: 100%; height: 100%; border: 0; }
  #photo.live { filter: none; }
  /* 사진 테두리: 손으로 그은 찌글한 정사각형, 사진보다 조금 크게 */
  #stage .frame {
    position: absolute;
    z-index: 2;
    top: calc(var(--s) * -0.035);
    left: calc(var(--s) * 0.025);
    width: calc(var(--s) * 1.07);
    height: calc(var(--s) * 1.07);
    overflow: visible;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #photo.on + .frame { opacity: 1; }
  #stage .frame path {
    fill: none;
    stroke: #1d2126;
    stroke-width: max(1.3px, calc(var(--thread-px, 2.4px) * 0.62));
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  /* 신호 패널 (js/signal.js): 가만히 놓인 실 한 줄 위로 까만 점이 곡을 따라 지나간다 */
  /* 재생바 (js/signal.js): 시간·곡 목록 버튼 / 실 한 줄(= 진행 막대) / 낙서 아이콘 버튼 / 타자기 문구.
     크기는 모두 사진 한 변(--s)에 비례 */
  #signal {
    position: relative;
    margin-top: calc(var(--s) * 0.075);
    color: #1d2126;
    font: 700 max(10px, calc(var(--s) * 0.032))/1.4 "Courier New", Courier, monospace;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #signal.on { opacity: 1; transition-delay: 0.4s; }
  #signal button {
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  #signal button:focus { outline: none; }
  #signal button:focus-visible { outline: 1.5px dashed #1d2126; outline-offset: 3px; }
  #signal svg { display: block; overflow: visible; }
  /* 낙서 선: 실보다 조금 가는 손그림 획 (아이콘 칸 크기와 상관없이 같은 굵기) */
  #signal .controls path, #signal .inf path {
    fill: none;
    stroke: currentColor;
    stroke-width: max(1.3px, calc(var(--thread-px, 2.4px) * 0.62));
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  #signal .more circle, #signal .head { fill: currentColor; }
  #signal .meta { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2px; }
  #signal .end { display: flex; flex-direction: column; align-items: flex-end; }
  #signal .more { width: 2.6em; height: 1.5em; margin: 0 -0.3em 0.1em 0; }
  #signal .more svg { width: 100%; height: 100%; }
  #signal .len { display: flex; align-items: center; min-height: 1.4em; }
  #signal .inf svg { width: 2.8em; height: 1.9em; margin: -0.25em -0.3em -0.25em 0; }
  #signal .inf[hidden] { display: none; }
  /* 실 한 줄: 타이포와 같은 굵기로 가만히 놓여 있고, 까만 점이 곡을 따라 지나간다. 끝이 있는 곡을 들을 땐 눌러서 위치를 옮길 수 있다 */
  #signal .wire { width: 100%; height: max(22px, calc(var(--s) * 0.09)); }
  #signal .wire path { fill: none; stroke: currentColor; stroke-width: var(--thread-px, 2.4px); stroke-linecap: round; stroke-linejoin: round; }
  #signal .wire.seekable { pointer-events: auto; cursor: pointer; }
  #signal .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: calc(var(--s) * 0.015);
    padding: 0 calc(var(--s) * 0.03);
  }
  #signal .ctl { width: max(26px, calc(var(--s) * 0.1)); height: max(26px, calc(var(--s) * 0.1)); transition: opacity 0.3s ease, transform 0.15s ease; }
  #signal .ctl svg { width: 100%; height: 100%; }
  #signal .ctl.play { width: max(40px, calc(var(--s) * 0.17)); height: max(40px, calc(var(--s) * 0.17)); }
  #signal .ctl:active { transform: scale(0.9); }
  /* 플러그가 빠져 있으면 재생 버튼만 또렷하다 (누르면 플러그가 꽂힌다) */
  #signal .controls.off .ctl:not(.play) { opacity: 0.25; }
  #signal .controls:not(.off) .shuffle:not(.on), #signal .controls:not(.off) .repeat[data-mode="off"] { opacity: 0.4; }
  #signal .repeat .one-mark { display: none; }
  #signal .repeat[data-mode="one"] .one-mark { display: inline; }
  /* 문구 칸은 한 줄 높이로 고정: 문구가 두 줄이 되거나 곡 목록이 열려도 아래로만 흘러넘치고, 사진·재생바 자리는 그대로다 */
  #signal .foot { height: calc(var(--s) * 0.05 + 1.4em); }
  #signal .caption {
    margin: calc(var(--s) * 0.05) 0 0;
    min-height: 1.4em;
    text-align: center;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  /* 곡 목록: 타자기 글씨, 지금 곡엔 손으로 그은 물결 밑줄 */
  #signal .tracks { margin: calc(var(--s) * 0.035) 0 0; padding: 0; list-style: none; text-align: center; }
  #signal .tracks button { padding: 0.2em 0.4em; opacity: 0.5; white-space: pre; }
  #signal .tracks button:hover { opacity: 0.85; }
  #signal .tracks button[aria-current] { opacity: 1; text-decoration: underline wavy; text-underline-offset: 0.3em; text-decoration-thickness: 1px; }
  #signal .caret {
    display: inline-block;
    width: 0.6em;
    height: 1.05em;
    margin-left: 1px;
    vertical-align: -0.15em;
    background: #1d2126;
    animation: caret 1.06s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  /* 고리 안쪽의 색 덩어리 버튼 (b, 하트, o): 글자가 자리 잡으면 번지듯 나타나고, 올리거나 열려 있으면 살짝 부풀며 진해진다 */
  #intro .blob {
    opacity: 0;
    pointer-events: none;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0.9);
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.2, .8, .3, 1), filter 0.25s ease;
  }
  #intro .blob.live { opacity: 0.9; transform: none; }
  #intro .blob.hover, #intro .blob.open { opacity: 1; transform: scale(1.05); filter: saturate(1.15); transition-duration: 0.25s; }
  #intro .blob:focus { outline: none; }
  #intro .blob:focus-visible { opacity: 1; transform: scale(1.05); }
  /* 색 덩어리를 누르면 옆에 나오는 미니 탭 */
  #tab {
    position: fixed;
    z-index: 3;
    width: 220px;
    max-width: calc(100vw - 32px);
    box-sizing: border-box;
    padding: 14px 16px 16px;
    background: #fff;
    border: 1px solid #e3e9ee;
    border-radius: 0;
    box-shadow: 0 10px 28px rgba(29, 33, 38, 0.1);
    color: #1d2126;
    font: 13px/1.55 "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    opacity: 0;
    visibility: hidden;
    transform: translateX(-6px) scale(0.97);
    transform-origin: left center;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
  }
  #tab.on { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  #tab .tab-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  #tab .tab-title { margin: 0; font-size: 11px; font-weight: 400; letter-spacing: 0.18em; color: #6b7a86; }
  #tab .tab-close {
    margin: -6px -8px -6px 0;
    padding: 6px 8px;
    border: 0;
    background: none;
    color: #9aaab6;
    font: 16px/1 Arial, sans-serif;
    cursor: pointer;
  }
  #tab .tab-close:hover { color: #3d4752; }
  #tab .tab-body { margin: 0; }
</style>
</head>
<body>
<svg id="backdrop" aria-hidden="true"></svg>
<div id="intro" role="img" aria-label="Statichearts"></div>
<button id="replay" type="button">REPLAY</button>
<div id="stage">
  <div id="ytbox"><div id="yt"></div></div>
  <img id="photo"src="./img/cheek.png" alt="제복을 입은 두 사람이 볼을 맞대고 웃는 그림">
  <div id="signal"></div>
</div>
<div id="tab" role="dialog" aria-labelledby="tab-title">
  <div class="tab-head"><h2 class="tab-title" id="tab-title"></h2><button class="tab-close" type="button" aria-label="닫기">×</button></div>
  <p class="tab-body"></p>
</div>
<script src="./js/backdrop.js?v=10"></script>
<script src="./js/sound.js?v=6"></script>
<script src="./js/signal.js?v=9"></script>
<script src="./js/intro.js?v=36"></script>
</body>
</html>
