<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f4">
<meta name="color-scheme" content="light">
<title>STATICHEARTS</title>
<style>
  :root {
    --bg: #f6f6f4;
    --ink: #17191b;
    --ghost: #83969b;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  /* 브라우저 UI·노치를 뺀 실제 사용 영역. JS가 이 사각형의 중앙에 오브제를 둔다. */
  #safe {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);
    pointer-events: none;
  }
  /* 화면 전체가 손가락 영역. 버튼처럼 보이는 요소는 없다. */
  #stage {
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: default;
  }
  #obj {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
  }
  #obj canvas, #obj svg {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #type text {
    fill: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    font-weight: 500;
    text-rendering: geometricPrecision;
    font-kerning: normal;
  }
  #measure { visibility: hidden; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<h1 class="sr">STATICHEARTS</h1>
<div id="safe"></div>
<div id="stage">
  <div id="obj">
    <canvas id="base"></canvas>
    <canvas id="fx"></canvas>
    <svg id="type" aria-hidden="true" focusable="false">
      <defs><path id="baseline" d="M0 0"/></defs>
      <text id="measure" x="0" y="-100">STATICHEARTS</text>
      <text id="title"><textPath id="tpath" href="#baseline" startOffset="0">STATICHEARTS</textPath></text>
    </svg>
  </div>
</div>
<script>
(() => {
  'use strict';

  const INK = '#17191b';
  const GHOST = '#83969b';

  const $ = (id) => document.getElementById(id);
  const safeEl = $('safe'), stage = $('stage'), obj = $('obj');
  const cvBase = $('base'), cvFx = $('fx');
  const svg = $('type'), titleEl = $('title'), tpath = $('tpath'), baselineEl = $('baseline'), measureEl = $('measure');
  const bctx = cvBase.getContext('2d');
  const ctx = cvFx.getContext('2d');

  // ───────────────────────── 형태 (단위 좌표, 하트 폭 ≈ 1) ─────────────────────────
  // 바람(홍지원): 하트 안쪽의 열린 끝에서 출발 → 골짜기에서 교차 → 넓고 유연한 왼쪽 둥근 부분 → 아래 끝
  const WIND_SEGS = [
    [[0.125, -0.055], [0.085, -0.120], [0.030, -0.200], [0.000, -0.250]],
    [[0.000, -0.250], [-0.045, -0.325], [-0.140, -0.475], [-0.275, -0.472]],
    [[-0.275, -0.472], [-0.410, -0.470], [-0.525, -0.365], [-0.522, -0.200]],
    [[-0.522, -0.200], [-0.518, -0.020], [-0.200, 0.285], [0.000, 0.500]],
  ];
  // 글자 구간: 아래 끝 → 오른쪽 아래 윤곽 (STATICHEARTS가 선을 대신한다)
  const TEXT_SEG = [[0.000, 0.500], [0.130, 0.392], [0.360, 0.212], [0.452, 0.020]];
  // 번개(차우연): 글자에서 이어받아 오른쪽 윤곽을 팽팽하게 올라가 골짜기를 지나 짧게 끊긴다
  const LIGHT_SEGS = [
    [[0.452, 0.020], [0.482, -0.040], [0.512, -0.120], [0.504, -0.205]],
    [[0.504, -0.205], [0.498, -0.355], [0.420, -0.458], [0.250, -0.452]],
    [[0.250, -0.452], [0.130, -0.448], [0.042, -0.352], [0.000, -0.250]],
    [[0.000, -0.250], [-0.026, -0.188], [-0.058, -0.128], [-0.082, -0.092]],
  ];
  // 번개 선의 짧은 꺾임 (f: 번개 구간 길이 비율, a: 법선 방향 진폭, w: 폭 — 단위 좌표)
  const KINKS = [
    { f: 0.115, a: 0.013, w: 0.034 },
    { f: 0.300, a: -0.009, w: 0.026 },
    { f: 0.945, a: 0.016, w: 0.038 },
  ];
  // 숨은 하트: 같은 윤곽을 살짝 돌리고 밀어낸 닫힌 곡선
  const RING_SEGS = [WIND_SEGS[1], WIND_SEGS[2], WIND_SEGS[3], TEXT_SEG, LIGHT_SEGS[0], LIGHT_SEGS[1], LIGHT_SEGS[2]];
  const RING_XFORM = { rot: -4.2 * Math.PI / 180, scale: 0.965, dx: 0.032, dy: 0.026 };
  const DOT_COUNT = 10;

  const WIND_W = 1.15;   // CSS px
  const LIGHT_W = 1.35;

  // ───────────────────────── 유틸 ─────────────────────────
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const bez = (p, t) => {
    const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return [a * p[0][0] + b * p[1][0] + c * p[2][0] + d * p[3][0], a * p[0][1] + b * p[1][1] + c * p[2][1] + d * p[3][1]];
  };
  function sampleSegs(segs, per = 160) {
    const out = [];
    segs.forEach((p, k) => {
      for (let i = k === 0 ? 0 : 1; i <= per; i++) out.push(bez(p, i / per));
    });
    return out;
  }
  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // 픽셀 좌표 폴리라인을 일정 간격으로 다시 뽑는다. {x, y, s, n}
  function resample(pts, step) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = cum[cum.length - 1];
    const n = Math.max(2, Math.round(L / step) + 1);
    const x = new Float32Array(n), y = new Float32Array(n), s = new Float32Array(n);
    let j = 1;
    for (let i = 0; i < n; i++) {
      const target = (i / (n - 1)) * L;
      while (j < cum.length - 1 && cum[j] < target) j++;
      const seg = cum[j] - cum[j - 1] || 1;
      const t = clamp((target - cum[j - 1]) / seg, 0, 1);
      x[i] = pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * t;
      y[i] = pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * t;
      s[i] = target;
    }
    return { x, y, s, n, len: L };
  }
  function slice(line, s0, s1) {
    const pts = [];
    for (let i = 0; i < line.n; i++) if (line.s[i] >= s0 && line.s[i] <= s1) pts.push([line.x[i], line.y[i]]);
    return pts;
  }
  // 법선: 진행 방향의 오른쪽(화면 좌표 y↓). 하트 윤곽에서는 대체로 바깥쪽.
  function normals(line) {
    const nx = new Float32Array(line.n), ny = new Float32Array(line.n);
    for (let i = 0; i < line.n; i++) {
      const a = Math.max(0, i - 2), b = Math.min(line.n - 1, i + 2);
      let tx = line.x[b] - line.x[a], ty = line.y[b] - line.y[a];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l; ty /= l;
      nx[i] = -ty; ny[i] = tx;
    }
    line.nx = nx; line.ny = ny;
    return line;
  }
  const kinkShape = (u) => {
    // 날카로운 Z자: 0 → +1 → -0.55 → 0 (직선 구간, 모서리 유지)
    if (u <= 0 || u >= 1) return 0;
    if (u < 0.36) return u / 0.36;
    if (u < 0.62) return 1 - (u - 0.36) / 0.26 * 1.55;
    return -0.55 + (u - 0.62) / 0.38 * 0.55;
  };

  // ───────────────────────── 상태 ─────────────────────────
  const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = reduceMQ.matches;

  const G = {};            // 레이아웃·형태 캐시
  let raf = 0, lastFrame = 0, lastNow = 0;
  let energy = 0;          // 간섭 세기 0..1
  let pressed = false, pid = null, pX = -1e4, pY = -1e4, downX = 0, downY = 0;
  let lpTimer = 0;
  let burst = null;        // 대기 상태의 아주 작은 잡음 폭발
  let nextBurst = 0;

  const egg = { phase: 'off', t0: 0, last: -1, edges: new Map(), lastAct: 0, doneAt: 0, fadeFrom: 0, fadeAlpha: 1 };

  // 단위 좌표 경계 (형태가 고정이므로 한 번만)
  const unitAll = sampleSegs(WIND_SEGS).concat(sampleSegs([TEXT_SEG]), sampleSegs(LIGHT_SEGS));
  const UB = unitAll.reduce((b, p) => ({
    x0: Math.min(b.x0, p[0]), x1: Math.max(b.x1, p[0]), y0: Math.min(b.y0, p[1]), y1: Math.max(b.y1, p[1]),
  }), { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 });

  // ───────────────────────── 레이아웃 ─────────────────────────
  function layout() {
    const r = safeEl.getBoundingClientRect();
    const vw = r.width || innerWidth, vh = r.height || innerHeight;
    const S = clamp(Math.min(vw * 0.80, vh * 0.54, 460), 180, 460);
    const margin = Math.ceil(S * 0.12 + 22);
    const W = Math.ceil((UB.x1 - UB.x0) * S + margin * 2);
    const H = Math.ceil((UB.y1 - UB.y0) * S + margin * 2);
    const ox = margin - UB.x0 * S, oy = margin - UB.y0 * S;
    const left = Math.round(r.left + vw / 2 - W / 2);
    const top = Math.round(r.top + vh / 2 - H / 2 - vh * 0.012);   // 광학 중심: 아주 약간 위

    Object.assign(G, { S, W, H, ox, oy, left, top });
    obj.style.width = W + 'px';
    obj.style.height = H + 'px';
    obj.style.transform = `translate(${left}px, ${top}px)`;

    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    G.dpr = dpr;
    for (const [cv, c] of [[cvBase, bctx], [cvFx, ctx]]) {
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    const toPx = (p) => [ox + p[0] * S, oy + p[1] * S];
    const step = 1.5;
    const windR = resample(sampleSegs(WIND_SEGS).map(toPx), step);
    const textR = normals(resample(sampleSegs([TEXT_SEG], 400).map(toPx), 1));
    const lightR = resample(sampleSegs(LIGHT_SEGS).map(toPx), step);

    // ── 글자 크기: 작은 화면에서도 16~18px 이상, 과한 자간 없음
    let fs = clamp(S * 0.058, 17, 25);
    let ls = 0.05;
    let textLen = 0;
    const minLine = 10;
    for (let guard = 0; guard < 40; guard++) {
      setFont(measureEl, fs, ls);
      textLen = measureEl.getComputedTextLength() - fs * ls; // 마지막 글자 뒤 자간 제외
      const need = textLen + fs * 1.0 + minLine * 2;
      if (need <= textR.len) break;
      if (fs > 16) fs -= 0.5; else if (ls > 0) ls = Math.max(0, ls - 0.01); else break;
    }
    setFont(titleEl, fs, ls);
    const gap = fs * 0.5;

    // ── 글자 기준선: 윤곽선을 대문자 높이의 절반만큼 바깥으로 밀어, 글자의 가운데가 선 위에 오게 한다
    const capHalf = fs * 0.355;
    const bx = [], by = [], bs = [0];
    for (let i = 0; i < textR.n; i++) {
      bx.push(textR.x[i] + textR.nx[i] * capHalf);
      by.push(textR.y[i] + textR.ny[i] * capHalf);
      if (i) bs.push(bs[i - 1] + Math.hypot(bx[i] - bx[i - 1], by[i] - by[i - 1]));
    }
    let d = `M${bx[0].toFixed(2)} ${by[0].toFixed(2)}`;
    for (let i = 2; i < textR.n; i += 2) d += `L${bx[i].toFixed(2)} ${by[i].toFixed(2)}`;
    d += `L${bx[textR.n - 1].toFixed(2)} ${by[textR.n - 1].toFixed(2)}`;
    baselineEl.setAttribute('d', d);

    const a = (textR.len - textLen) / 2;                       // 윤곽선 위의 글자 시작 (가운데 정렬)
    const ia = Math.round(a);                                  // textR 간격 1px
    const sA = bs[clamp(ia, 0, bs.length - 1)];
    tpath.setAttribute('startOffset', sA.toFixed(2));
    let ib = ia;
    while (ib < bs.length - 1 && bs[ib] < sA + textLen) ib++;
    const b = textR.s[ib];
    Object.assign(G, { fs, gap, textA: a, textB: b, textR });

    // ── 바람 선 = 바람 + 글자 앞 윤곽 / 번개 선 = 글자 뒤 윤곽 + 번개
    const windPts = slice(windR, 0, windR.len).concat(slice(textR, 0.5, a - gap));
    const tailPts = slice(textR, b + gap, textR.len);
    const lightPts = tailPts.concat(slice(lightR, 0.75, lightR.len));
    const wind = normals(resample(windPts, step));
    const light = normals(resample(lightPts, step));

    // 번개 꺾임은 매끈한 법선을 기준으로 위치만 비튼다
    const lightStart = light.len - lightR.len;
    for (const k of KINKS) {
      const c = lightStart + k.f * lightR.len, w = k.w * S, amp = k.a * S;
      for (let i = 0; i < light.n; i++) {
        const u = (light.s[i] - (c - w / 2)) / w;
        const v = kinkShape(u);
        if (v) { light.x[i] += light.nx[i] * amp * v; light.y[i] += light.ny[i] * amp * v; }
      }
    }

    // 잡음 가중치: 글자 쪽 끝은 잦아들어 글자를 침범하지 않게
    const fadeLen = Math.max(14, fs * 0.9);
    wind.wt = new Float32Array(wind.n);
    for (let i = 0; i < wind.n; i++) wind.wt[i] = clamp((wind.len - wind.s[i]) / fadeLen, 0.12, 1);
    light.wt = new Float32Array(light.n);
    for (let i = 0; i < light.n; i++) light.wt[i] = clamp(light.s[i] / fadeLen, 0.12, 1);

    Object.assign(wind, { kind: 'wind', base: 0.42, peak: 6.0, knot: 9, amp: new Float32Array(wind.n) });
    Object.assign(light, { kind: 'light', base: 0.55, peak: 7.0, knot: 2, amp: new Float32Array(light.n) });
    G.wind = wind; G.light = light;
    G.sigma = clamp(S * 0.085, 24, 44);

    // 글자 손가락 판정용 구간
    G.textHit = Math.max(26, fs * 1.6);

    buildRing();
    drawBase();
    resetEgg();
    renderOnce();
  }

  function setFont(el, fs, ls) {
    el.style.fontSize = fs + 'px';
    el.style.letterSpacing = (fs * ls).toFixed(2) + 'px';
  }

  // ───────────────────────── 고정된 선 ─────────────────────────
  function drawBase() {
    const { W, H, wind, light } = G;
    bctx.clearRect(0, 0, W, H);
    bctx.strokeStyle = INK;
    bctx.lineJoin = 'round';

    // 바람: 안쪽의 열린 끝은 가늘게 사라지고, 나머지는 한 획
    const taper = Math.max(24, G.S * 0.09);
    bctx.lineCap = 'round';
    let i = 1;
    for (; i < wind.n && wind.s[i] < taper; i++) {
      const t = wind.s[i] / taper;
      bctx.lineWidth = WIND_W * (0.18 + 0.82 * t * t * (3 - 2 * t));
      bctx.beginPath();
      bctx.moveTo(wind.x[i - 1], wind.y[i - 1]);
      bctx.lineTo(wind.x[i], wind.y[i]);
      bctx.stroke();
    }
    bctx.lineWidth = WIND_W;
    bctx.beginPath();
    bctx.moveTo(wind.x[i - 1], wind.y[i - 1]);
    for (; i < wind.n; i++) bctx.lineTo(wind.x[i], wind.y[i]);
    bctx.stroke();

    // 번개: 끝이 칼같이 잘린다
    bctx.lineCap = 'butt';
    bctx.lineJoin = 'miter';
    bctx.miterLimit = 6;
    bctx.lineWidth = LIGHT_W;
    bctx.beginPath();
    bctx.moveTo(light.x[0], light.y[0]);
    for (let j = 1; j < light.n; j++) bctx.lineTo(light.x[j], light.y[j]);
    bctx.stroke();
  }

  // ───────────────────────── 가장자리 잡음 ─────────────────────────
  let knotBuf = new Float32Array(1024);

  function computeAmp(line, e, now) {
    const { sigma } = G;
    const inv = 1 / (2 * sigma * sigma);
    const amp = line.amp;
    let near = 0;
    for (let i = 0; i < line.n; i++) {
      let a = line.base;
      if (e > 0.002) {
        const dx = line.x[i] - pX, dy = line.y[i] - pY;
        const g = Math.exp(-(dx * dx + dy * dy) * inv);
        const add = e * line.peak * g;
        a += add;
        if (add > 0.6) near++;
      }
      if (burst && burst.line === line) {
        const u = (i - burst.i) / burst.w;
        a += burst.a * Math.exp(-u * u) * Math.sin(Math.PI * clamp((now - burst.t0) / burst.dur, 0, 1));
      }
      amp[i] = a * line.wt[i];
    }
    return near;
  }

  function fillKnots(line, rnd) {
    const m = Math.ceil(line.n / line.knot) + 2;
    if (knotBuf.length < m) knotBuf = new Float32Array(m * 2);
    const spike = line.kind === 'light';
    for (let k = 0; k < m; k++) {
      let v = rnd() * 2 - 1;
      if (spike && rnd() < 0.025) v *= 2.2;
      knotBuf[k] = v;
    }
  }
  function noiseAt(line, i, rnd) {
    const K = line.knot, k = Math.floor(i / K), f = (i - k * K) / K;
    const a = knotBuf[k], b = knotBuf[k + 1];
    if (line.kind === 'wind') {
      const s = f * f * (3 - 2 * f);           // 바람: 부드럽게 이어지는 떨림
      return a + (b - a) * s + (rnd() - 0.5) * 0.35;
    }
    return a + (b - a) * f;                      // 번개: 짧고 각진 떨림
  }

  function jitterPass(line, color, alpha, width, bias, rnd) {
    fillKnots(line, rnd);
    const amp = line.amp;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    for (let i = 0; i < line.n; i++) {
      const off = noiseAt(line, i, rnd) * amp[i] + bias * amp[i];
      const x = line.x[i] + line.nx[i] * off, y = line.y[i] + line.ny[i] * off;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
  }

  function speckles(line, count, rnd, nearOnly) {
    const amp = line.amp;
    for (let c = 0; c < count; c++) {
      let i = (rnd() * line.n) | 0;
      if (nearOnly) {
        // 손가락 근처 표본 찾기 (몇 번만 시도)
        let tries = 0;
        while (amp[i] < line.base * 2.5 && tries++ < 12) i = (rnd() * line.n) | 0;
        if (amp[i] < line.base * 2.5) continue;
      }
      const off = (rnd() * 2 - 1) * (0.9 + amp[i] * 1.35);
      const x = line.x[i] + line.nx[i] * off, y = line.y[i] + line.ny[i] * off;
      const sz = rnd() < 0.78 ? 1 : 1.5;
      ctx.globalAlpha = (0.18 + rnd() * 0.4) * line.wt[i];
      ctx.fillStyle = rnd() < 0.3 ? GHOST : INK;
      ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
    }
  }

  function sparks(line, count, rnd) {
    // 번개 선의 짧은 꺾인 불꽃 — 손가락 근처에서만
    const amp = line.amp;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 0.8;
    ctx.lineJoin = 'miter';
    for (let c = 0; c < count; c++) {
      let i = (rnd() * line.n) | 0, tries = 0;
      while (amp[i] < line.peak * 0.45 && tries++ < 16) i = (rnd() * line.n) | 0;
      if (amp[i] < line.peak * 0.45) continue;
      const side = rnd() < 0.5 ? -1 : 1;
      const nx = line.nx[i] * side, ny = line.ny[i] * side;
      const tx = -line.ny[i], ty = line.nx[i];
      const r0 = 1.5 + rnd() * 1.5, r1 = r0 + 2 + rnd() * 3, r2 = r1 + 2 + rnd() * 3;
      const x0 = line.x[i] + nx * r0, y0 = line.y[i] + ny * r0;
      ctx.globalAlpha = 0.35 + rnd() * 0.3;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(line.x[i] + nx * r1 + tx * 2.2, line.y[i] + ny * r1 + ty * 2.2);
      ctx.lineTo(line.x[i] + nx * r2 - tx * 0.8, line.y[i] + ny * r2 - ty * 0.8);
      ctx.stroke();
    }
  }

  function drawNoise(now, rnd) {
    const { wind, light } = G;
    const e = energy * (egg.phase === 'off' ? 1 : 0.25);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const nearW = computeAmp(wind, e, now);
    const nearL = computeAmp(light, e, now);

    // 바람: 길게 흐르는 떨림 두 겹 (하나는 청회색 잔상)
    jitterPass(wind, INK, 0.30, 0.7, 0, rnd);
    jitterPass(wind, GHOST, 0.32, 0.7, 0.55, rnd);
    if (nearW) jitterPass(wind, INK, 0.16 * Math.min(1, e * 1.5), 0.6, -0.35, rnd);

    // 번개: 촘촘하고 각진 떨림
    jitterPass(light, INK, 0.30, 0.7, 0, rnd);
    jitterPass(light, GHOST, 0.32, 0.7, 0.55, rnd);

    // 가장자리 백색소음
    speckles(wind, Math.round(wind.n / 18), rnd, false);
    speckles(light, Math.round(light.n / 15), rnd, false);
    if (nearW) speckles(wind, Math.round(e * 34), rnd, true);
    if (nearL) {
      speckles(light, Math.round(e * 40), rnd, true);
      if (e > 0.3) sparks(light, rnd() < 0.6 ? 1 : 2, rnd);
    }
    ctx.globalAlpha = 1;
  }

  // ───────────────────────── 숨은 하트 ─────────────────────────
  function buildRing() {
    const { S, ox, oy } = G;
    const { rot, scale, dx, dy } = RING_XFORM;
    const cx = (UB.x0 + UB.x1) / 2, cy = (UB.y0 + UB.y1) / 2;
    const cs = Math.cos(rot), sn = Math.sin(rot);
    const pts = sampleSegs(RING_SEGS).map(([x, y]) => {
      const u = (x - cx) * scale, v = (y - cy) * scale;
      return [ox + (cx + u * cs - v * sn + dx) * S, oy + (cy + u * sn + v * cs + dy) * S];
    });
    pts.push(pts[0]);
    const ring = resample(pts, 1.5);
    // 글자 위로는 지나가지 않는다: 제목 둘레의 링 구간은 비워 둔다
    const { textR, textA, textB, fs } = G;
    const clear2 = (fs * 0.95) ** 2;
    ring.blocked = new Uint8Array(ring.n);
    for (let i = 0; i < ring.n; i++) {
      for (let j = 0; j < textR.n; j += 2) {
        if (textR.s[j] < textA - fs * 0.4 || textR.s[j] > textB + fs * 0.4) continue;
        if ((textR.x[j] - ring.x[i]) ** 2 + (textR.y[j] - ring.y[i]) ** 2 < clear2) { ring.blocked[i] = 1; break; }
      }
    }
    // 점은 비워 둔 구간을 뺀 윤곽 위에 고르게 놓는다 (순환 순서 유지)
    const free = [];
    for (let i = 0; i < ring.n - 1; i++) if (!ring.blocked[i]) free.push(i);
    const dots = [];
    for (let k = 0; k < DOT_COUNT; k++) {
      const i = free[Math.floor(((k + 0.35) / DOT_COUNT) * free.length)];
      dots.push({ x: ring.x[i], y: ring.y[i], s: ring.s[i], i });
    }
    G.ring = ring;
    G.dots = dots;
    G.dotHit = Math.max(22, S * 0.065);
  }

  function resetEgg() {
    egg.phase = 'off';
    egg.edges.clear();
    egg.last = -1;
  }

  function startEgg(now) {
    resetEgg();
    egg.phase = 'dots';
    egg.t0 = now;
    egg.lastAct = now;
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
    kick();
  }

  // 링 위의 [i0 → i1] 구간을 그린다 (인덱스는 순환)
  function strokeRing(i0, i1, dir) {
    const r = G.ring, n = r.n - 1;
    ctx.beginPath();
    let i = i0, pen = !r.blocked[i];
    ctx.moveTo(r.x[i], r.y[i]);
    for (let guard = 0; guard <= n && i !== i1; guard++) {
      i = (i + dir + n) % n;
      if (r.blocked[i]) { pen = false; continue; }
      if (pen) ctx.lineTo(r.x[i], r.y[i]); else ctx.moveTo(r.x[i], r.y[i]);
      pen = true;
    }
    ctx.stroke();
  }

  function eggTouch(x, y, now) {
    if (egg.phase !== 'dots') return;
    const { dots, dotHit } = G;
    let hit = -1, best = dotHit * dotHit;
    for (let k = 0; k < dots.length; k++) {
      const d = (dots[k].x - x) ** 2 + (dots[k].y - y) ** 2;
      if (d < best) { best = d; hit = k; }
    }
    if (hit < 0 || hit === egg.last) return;
    egg.lastAct = now;
    const N = dots.length, prev = egg.last;
    if (prev >= 0) {
      const fwd = (prev + 1) % N === hit, back = (hit + 1) % N === prev;
      if (fwd || back) {
        const key = fwd ? prev : hit;   // 간선 k: 점 k → 점 k+1
        if (!egg.edges.has(key)) egg.edges.set(key, { from: prev, to: hit, dir: fwd ? 1 : -1, t0: now });
      }
    }
    egg.last = hit;
    if (egg.edges.size === N) {
      egg.phase = 'done';
      egg.doneAt = now;
    }
  }

  function drawEgg(now) {
    if (egg.phase === 'off') return;
    const { dots, ring } = G;
    const N = dots.length;
    const HOLD = 2400, FADE = 1600, IDLE = 9000, IDLE_FADE = 700;

    let master = 1;
    if (egg.phase === 'dots' && now - egg.lastAct > IDLE && !pressed) {
      egg.phase = 'fade';
      egg.fadeFrom = now;
    }
    if (egg.phase === 'fade') {
      master = 1 - (now - egg.fadeFrom) / IDLE_FADE;
      if (master <= 0) { resetEgg(); return; }
    }
    if (egg.phase === 'done') {
      const t = now - egg.doneAt;
      if (t > HOLD) master = 1 - (t - HOLD) / FADE;
      if (master <= 0) { resetEgg(); return; }
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.05;

    if (egg.phase === 'done') {
      // 완성: 살짝 어긋난 두 번째 하트가 남는다
      const settle = reduce ? 1 : clamp((now - egg.doneAt) / 260, 0, 1);
      ctx.globalAlpha = 0.62 * master;
      strokeRing(0, ring.n - 2, 1);
      ctx.globalAlpha = 0.22 * master * settle;
      ctx.strokeStyle = GHOST;
      ctx.lineWidth = 0.8;
      ctx.save();
      ctx.translate(0.8, 0.6);
      strokeRing(0, ring.n - 2, 1);
      ctx.restore();
      ctx.globalAlpha = 1;
      return;
    }

    // 이어진 구간
    ctx.globalAlpha = 0.62 * master;
    for (const ed of egg.edges.values()) {
      const p = reduce ? 1 : clamp((now - ed.t0) / 200, 0, 1);
      const a = dots[ed.from].i, b = dots[ed.to].i, n = ring.n - 1;
      const span = ed.dir > 0 ? (b - a + n) % n : (a - b + n) % n;
      const end = (a + ed.dir * Math.round(span * p) + n) % n;
      strokeRing(a, end, ed.dir);
    }

    // 손가락까지 이어지는 가는 안내선
    if (pressed && egg.last >= 0 && egg.phase === 'dots') {
      const d = dots[egg.last];
      ctx.globalAlpha = 0.45 * master;
      ctx.strokeStyle = GHOST;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(pX, pY);
      ctx.stroke();
    }

    // 점
    for (let k = 0; k < N; k++) {
      const appear = reduce ? 1 : clamp((now - egg.t0 - k * 40) / 320, 0, 1);
      if (appear <= 0) continue;
      const touched = egg.last === k || [...egg.edges.values()].some((ed) => ed.from === k || ed.to === k);
      ctx.globalAlpha = (touched ? 0.85 : 0.5) * appear * master;
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(dots[k].x, dots[k].y, touched ? 2.1 : 1.7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ───────────────────────── 루프 ─────────────────────────
  const staticRnd = () => mulberry32(0x5717c);

  function renderOnce(now = performance.now()) {
    ctx.clearRect(0, 0, G.W, G.H);
    drawNoise(now, reduce && energy < 0.002 ? staticRnd() : Math.random);
    drawEgg(now);
  }

  function needsLoop() {
    return !reduce || energy > 0.002 || pressed || egg.phase !== 'off';
  }

  function frame(now) {
    raf = 0;
    if (document.hidden) return;
    const dt = Math.min(100, now - (lastNow || now));
    lastNow = now;

    // 간섭: 누르면 빠르게 커지고, 놓으면 가라앉는다
    if (pressed) energy += (1 - energy) * (1 - Math.exp(-dt / (reduce ? 160 : 90)));
    else energy *= Math.exp(-dt / (reduce ? 220 : 420));
    if (energy < 0.002) energy = 0;
    const peakScale = reduce ? 0.45 : 1;

    // 대기 중 아주 가끔, 짧은 구간만 지직
    if (!reduce) {
      if (burst && now - burst.t0 > burst.dur) burst = null;
      if (!burst && now > nextBurst) {
        const line = Math.random() < 0.6 ? G.light : G.wind;
        burst = { line, i: (Math.random() * line.n) | 0, w: 8 + Math.random() * 10, a: 0.9 + Math.random() * 0.8, t0: now, dur: 120 + Math.random() * 120 };
        nextBurst = now + 1800 + Math.random() * 3200;
      }
    } else burst = null;

    if (!needsLoop()) {
      lastNow = 0;
      renderOnce(now);
      return;
    }

    // 정전기처럼: 약 24fps로 갱신
    if (now - lastFrame >= 1000 / 24 - 2) {
      lastFrame = now;
      const keep = energy;
      energy = keep * peakScale;
      renderOnce(now);
      energy = keep;
    }
    raf = requestAnimationFrame(frame);
  }

  function kick() {
    if (!raf && !document.hidden) raf = requestAnimationFrame(frame);
  }

  // ───────────────────────── 입력 ─────────────────────────
  function local(e) {
    return [e.clientX - G.left, e.clientY - G.top];
  }
  function nearText(x, y) {
    const { textR, textA, textB, textHit } = G;
    const r2 = textHit * textHit;
    for (let i = 0; i < textR.n; i += 2) {
      if (textR.s[i] < textA - 6 || textR.s[i] > textB + 6) continue;
      const dx = textR.x[i] - x, dy = textR.y[i] - y;
      if (dx * dx + dy * dy < r2) return true;
    }
    return false;
  }
  function cancelLongPress() {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = 0; }
  }

  stage.addEventListener('pointerdown', (e) => {
    if (pid !== null) return;
    pid = e.pointerId;
    try { stage.setPointerCapture(pid); } catch (_) {}
    pressed = true;
    [pX, pY] = local(e);
    downX = pX; downY = pY;
    const now = performance.now();
    if (egg.phase === 'off' && nearText(pX, pY)) {
      lpTimer = setTimeout(() => { lpTimer = 0; startEgg(performance.now()); }, 600);
    }
    eggTouch(pX, pY, now);
    kick();
  });
  stage.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const now = performance.now();
    for (const ev of evs.length ? evs : [e]) {
      [pX, pY] = local(ev);
      eggTouch(pX, pY, now);
    }
    if (lpTimer && Math.hypot(pX - downX, pY - downY) > 12) cancelLongPress();
    kick();
  });
  const release = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    pressed = false;
    cancelLongPress();
    egg.last = -1;
    if (egg.phase === 'dots') egg.lastAct = performance.now();
    kick();
  };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // ───────────────────────── 환경 ─────────────────────────
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      lastNow = 0;
      pressed = false; pid = null; energy = 0;
      cancelLongPress();
    } else {
      kick();
    }
  });
  const onReduce = () => { reduce = reduceMQ.matches; renderOnce(); kick(); };
  if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', onReduce); else reduceMQ.addListener(onReduce);

  let resizeQueued = false;
  const onResize = () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; layout(); kick(); });
  };
  addEventListener('resize', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

  const boot = () => { layout(); kick(); };
  if (document.fonts && document.fonts.ready) {
    layout();                       // 접속 즉시 완성된 하트
    document.fonts.ready.then(boot);
  } else boot();

  // 검증용 훅 (UI에는 노출되지 않음)
  window.__SH = { G, egg, get energy() { return energy; } };
})();
</script>
</body>
</html>
